org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/data/data/com.dsharnessmobile.shell/files/home/tmp
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# The Kotlin daemon cannot bind its RMI port / temp dir in this sandboxed
# on-device build, and every invocation burns minutes retrying before it falls
# back to in-process compilation. Compile in-process from the start.
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
# On aarch64 hosts Gradle's default aapt2 is x86_64-only and cannot run, so
# route every aapt2 invocation to the device-native Termux aapt2.
android.aapt2FromMavenOverride=/data/data/com.dsharnessmobile.shell/files/usr/bin/aapt2
